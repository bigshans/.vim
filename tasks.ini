[float-shell]
command/win32=powershell -Command "&{ $(?command) }"
command/linux=$(?command)
output=terminal
pos=floaterm
focus=1
close=0

[build]
command:PKGBUILD/linux=makepkg -sfi
output=terminal
pos=floaterm
focus=1
close=0

[pkg-get]
command:PKGBUILD/linux=makepkg -g
output=terminal
pos=floaterm
focus=1
close=0

[pkg-get-pc]
command:PKGBUILD/linux=proxychains -q makepkg -g
output=terminal
pos=floaterm
focus=1
close=0

[git-push]
command=git push
output=terminal
pos=floaterm
focus=1
close=0

[git-pull]
command=git push
output=terminal
pos=floaterm
focus=1
close=0

[js-staging]
command=npm run staging
output=terminal
pos=floaterm
close=0

[js-build]
command=npm run build
output=terminal
pos=floaterm
focus=1
close=0

[ni]
command=ni
output=terminal
pos=floaterm
focus=1
close=0

[nr]
command=nr $(?script code)
output=terminal
pos=floaterm
focus=1
close=0
