[float-shell]
command/win32=powershell -Command "&{ $(?command) }"
command/linux=$(?command)
output=terminal
pos=floaterm
focus=1
close=0

[build]
command:PKGBUILD/linux=makepkg -sfi
output=terminal
pos=floaterm
focus=1
close=0

[pkg-get]
command:PKGBUILD/linux=makepkg -g
output=terminal
pos=floaterm
focus=1
close=0

[pkg-get-pc]
command:PKGBUILD/linux=proxychains -q makepkg -g
output=terminal
pos=floaterm
focus=1
close=0
