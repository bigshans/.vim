name: lint

on:
  push:
  pull_request:

jobs:
  vint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install vint
        run: pip install vim-vint

      - name: Lint config
        run: |
          vint core/ \
               autoload/packs.vim \
               autoload/utils.vim \
               plugin/dashboard.vim \
               ftplugin/ \
               after/ftplugin/
